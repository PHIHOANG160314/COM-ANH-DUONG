name: React App CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  build-and-test:
    name: 🏗️ Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-app/package-lock.json

      - name: 📥 Install Dependencies
        working-directory: react-app
        run: npm ci

      - name: 🔍 Lint
        working-directory: react-app
        run: npm run lint

      - name: 🧪 Unit Tests
        working-directory: react-app
        run: npm test

      - name: 🏗️ Build
        working-directory: react-app
        run: npm run build

  deploy-production:
    name: 🚀 Deploy Production
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🔗 Pull Vercel Config
        working-directory: react-app
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build with Vercel
        working-directory: react-app
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy to Production
        working-directory: react-app
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $URL"

      - name: 📧 Summary
        env:
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "# 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | $REF_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | $DEPLOY_URL |" >> $GITHUB_STEP_SUMMARY

  deploy-preview:
    name: 🔍 Deploy Preview
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🔗 Pull Vercel Config
        working-directory: react-app
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build with Vercel
        working-directory: react-app
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy Preview
        working-directory: react-app
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🔍 Preview URL: $URL"

      - name: 💬 Comment on PR
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔍 Preview Deployment Ready!\n\n🔗 **URL**: ${url}\n\nThis preview will be updated with each new commit.`
            });

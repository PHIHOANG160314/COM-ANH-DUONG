name: Com Anh Duong CI/CD

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Install Vercel CLI
        run: npm install -g vercel@latest

      - name: 🚀 Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed to: $URL"

      - name: 📧 Summary
        env:
          REF_NAME: ${{ github.ref_name }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "# 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | $REF_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| URL | $DEPLOY_URL |" >> $GITHUB_STEP_SUMMARY
          echo "| Site | [comanhduong.com](https://comanhduong.com) |" >> $GITHUB_STEP_SUMMARY

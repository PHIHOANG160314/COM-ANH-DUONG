<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Customer Ordering | Cơm Ánh Dương</title>
    <link rel="stylesheet" href="css/wireframe.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="placeholder" style="width: 40px; height: 40px; border-radius: 50%;">Logo</div>
            <div class="header-title">Cơm Ánh Dương</div>
        </div>
        <button class="btn btn-text" style="color: white; font-size: 24px;">🛒<span class="badge badge-success" style="position:absolute; top: 12px; margin-left: 12px;">2</span></button>
    </header>

    <main class="container mb-4">
        <!-- Hero / Promo -->
        <div class="card mb-4" style="background: var(--primary-container); border: none;">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="mb-4">Hôm nay ăn gì?</h2>
                    <p class="mb-4">Giảm 20% cho đơn hàng đầu tiên</p>
                    <button class="btn btn-primary">Đặt ngay</button>
                </div>
                <div class="placeholder" style="width: 100px; height: 100px;">Promo Image</div>
            </div>
        </div>

        <!-- Search -->
        <div class="mb-4">
            <input type="text" class="input" placeholder="🔍 Tìm món ăn yêu thích...">
        </div>

        <!-- Categories -->
        <div class="flex gap-2 mb-4" style="overflow-x: auto; padding-bottom: 8px;">
            <button class="btn btn-primary">Tất cả</button>
            <button class="btn btn-outlined">Cơm tấm</button>
            <button class="btn btn-outlined">Bún / Phở</button>
            <button class="btn btn-outlined">Đồ uống</button>
        </div>

        <!-- Menu Grid -->
        <h3 class="mb-4">Món Nổi Bật</h3>
        <div class="grid-2">
            <!-- Product Card 1 -->
            <div class="card">
                <div class="placeholder mb-4" style="width: 100%; height: 120px;">Food Image</div>
                <h4 class="mb-4">Cơm Sườn Bì Chả</h4>
                <div class="flex justify-between items-center mt-4">
                    <span style="color: var(--primary); font-weight: 600;">45.000đ</span>
                    <button class="btn btn-primary" style="padding: 6px 12px;">+</button>
                </div>
            </div>
             <!-- Product Card 2 -->
             <div class="card">
                <div class="placeholder mb-4" style="width: 100%; height: 120px;">Food Image</div>
                <h4 class="mb-4">Phở Bò Đặc Biệt</h4>
                <div class="flex justify-between items-center mt-4">
                    <span style="color: var(--primary); font-weight: 600;">55.000đ</span>
                    <button class="btn btn-primary" style="padding: 6px 12px;">+</button>
                </div>
            </div>
             <!-- Product Card 3 -->
             <div class="card">
                <div class="placeholder mb-4" style="width: 100%; height: 120px;">Food Image</div>
                <h4 class="mb-4">Bún Thịt Nướng</h4>
                <div class="flex justify-between items-center mt-4">
                    <span style="color: var(--primary); font-weight: 600;">40.000đ</span>
                    <button class="btn btn-primary" style="padding: 6px 12px;">+</button>
                </div>
            </div>
             <!-- Product Card 4 -->
             <div class="card">
                <div class="placeholder mb-4" style="width: 100%; height: 120px;">Food Image</div>
                <h4 class="mb-4">Cà Phê Sữa Đá</h4>
                <div class="flex justify-between items-center mt-4">
                    <span style="color: var(--primary); font-weight: 600;">25.000đ</span>
                    <button class="btn btn-primary" style="padding: 6px 12px;">+</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Menu</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Đơn hàng</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🎁</span>
            <span>Ưu đãi</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">👤</span>
            <span>Tài khoản</span>
        </a>
    </nav>
</body>
</html>

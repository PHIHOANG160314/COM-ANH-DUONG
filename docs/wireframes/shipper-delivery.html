<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe - Shipper Delivery | Cơm Ánh Dương</title>
    <link rel="stylesheet" href="css/wireframe.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="header-title">Shipper App</div>
        </div>
        <div class="flex gap-2">
            <div style="width: 10px; height: 10px; background: #4CAF50; border-radius: 50%;"></div>
            <span style="font-size: 14px;">Online</span>
        </div>
    </header>

    <div class="container">
        <!-- Status Tabs -->
        <div class="flex gap-2 mb-4" style="overflow-x: auto;">
            <button class="btn btn-primary">Đơn mới (2)</button>
            <button class="btn btn-outlined">Đang giao (1)</button>
            <button class="btn btn-outlined">Lịch sử</button>
        </div>

        <!-- Order List -->
        <div class="flex-col gap-4">
            <!-- New Order Card -->
            <div class="card" style="border-left: 4px solid #FFC107;">
                <div class="flex justify-between mb-2">
                    <span class="badge badge-pending">Đơn mới</span>
                    <span style="color: #666;">2 phút trước</span>
                </div>
                <h3 class="mb-2">#ORD-2024</h3>
                <div class="mb-4">
                    <div class="flex gap-2 items-start mb-2">
                        <span>📍</span>
                        <div>
                            <strong>Lấy:</strong> Cơm Ánh Dương<br>
                            <span style="font-size: 12px; color: #666;">91 Hùng Vương, Sa Đéc</span>
                        </div>
                    </div>
                    <div class="flex gap-2 items-start">
                        <span>🏳️</span>
                        <div>
                            <strong>Giao:</strong> Nguyễn Văn A<br>
                            <span style="font-size: 12px; color: #666;">123 Nguyễn Huệ, P2, Sa Đéc (2.5km)</span>
                        </div>
                    </div>
                </div>
                <div class="flex justify-between items-center border-t pt-2" style="border-top: 1px dashed #eee;">
                    <span style="font-weight: 600;">COD: 125.000đ</span>
                    <button class="btn btn-primary">Nhận đơn</button>
                </div>
            </div>

            <!-- Active Delivery Card -->
            <div class="card" style="border-left: 4px solid #2196F3;">
                <div class="flex justify-between mb-2">
                    <span class="badge" style="background: #E3F2FD; color: #2196F3;">Đang giao</span>
                    <div class="flex gap-2">
                        <button class="btn btn-outlined" style="padding: 4px 8px;">📞 Gọi</button>
                        <button class="btn btn-outlined" style="padding: 4px 8px;">🗺️ Map</button>
                    </div>
                </div>
                <h3 class="mb-2">#ORD-2023</h3>
                <div class="mb-4">
                     <div class="placeholder" style="width: 100%; height: 150px; margin-bottom: 12px;">Map View</div>
                     <div>
                        <strong>Khách:</strong> Trần Thị B<br>
                        <span>456 Trần Phú, Sa Đéc</span>
                     </div>
                </div>
                <button class="btn btn-success" style="width: 100%;">Xác nhận giao thành công</button>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <span class="nav-icon">📦</span>
            <span>Đơn hàng</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">💰</span>
            <span>Thu nhập</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">⚙️</span>
            <span>Cài đặt</span>
        </a>
    </nav>
</body>
</html>

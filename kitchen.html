<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bếp - Ánh Dương F&amp;B</title>
    <meta name="description" content="Màn hình hiển thị bếp - Quản lý và theo dõi đơn hàng realtime">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/m3-typography.css">
    <link rel="stylesheet" href="css/m3-design-system.css">
    <link rel="stylesheet" href="css/m3-adaptive-layouts.css">
    <link rel="stylesheet" href="css/m3-accessibility.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pagination.css">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-72.png">
    <meta name="theme-color" content="#006400">
    <link rel="manifest" href="manifest.json">

    <!-- Security: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co;

    <style>
        /* Kitchen Display Specific Styles */
        :root {
            --kitchen-pending: #FEF3C7;
            --kitchen-pending-border: #F59E0B;
            --kitchen-preparing: #DBEAFE;
            --kitchen-preparing-border: #3B82F6;
            --kitchen-ready: #D1FAE5;
            --kitchen-ready-border: #10B981;
        }

        body {
            background: var(--md-sys-color-surface, #1a1a2e);
            color: var(--md-sys-color-on-surface, #ffffff);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .kitchen-page {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .kitchen-header {
            background: linear-gradient(135deg, var(--md-sys-color-primary-container, #004d00) 0%, var(--md-sys-color-primary, #006400) 100%);
            color: var(--md-sys-color-on-primary, #ffffff);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .kitchen-header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .kitchen-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
        }

        .kitchen-title h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .kitchen-title p {
            margin: 0;
            font-size: 0.875rem;
            opacity: 0.9;
        }

        .kitchen-stats {
            display: flex;
            gap: 1.5rem;
        }

        .stat-item {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            display: block;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .stat-label {
            display: block;
            font-size: 0.75rem;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-item.pending .stat-value {
            color: #FCD34D;
        }

        .stat-item.preparing .stat-value {
            color: #60A5FA;
        }

        .stat-item.ready .stat-value {
            color: #34D399;
        }

        .kitchen-main {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
        }

        .kitchen-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--md-sys-color-surface-container, rgba(255, 255, 255, 0.05));
            padding: 0.5rem;
            border-radius: 16px;
        }

        .kitchen-tab {
            flex: 1;
            padding: 0.75rem 1rem;
            border: none;
            background: transparent;
            color: var(--md-sys-color-on-surface-variant, #aaa);
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .kitchen-tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .kitchen-tab.active {
            background: var(--md-sys-color-primary, #006400);
            color: var(--md-sys-color-on-primary, #fff);
        }

        .kitchen-tab .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.25rem 0.5rem;
            border-radius: 20px;
            font-size: 0.75rem;
            min-width: 20px;
        }

        .kitchen-tab.active .badge {
            background: rgba(255, 255, 255, 0.3);
        }

        .kitchen-orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }

        .kitchen-order-card {
            background: var(--md-sys-color-surface-container, #2a2a4a);
            border-radius: 16px;
            padding: 1.25rem;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .kitchen-order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .kitchen-order-card.pending {
            border-left-color: var(--kitchen-pending-border);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, var(--md-sys-color-surface-container, #2a2a4a) 100%);
        }

        .kitchen-order-card.preparing {
            border-left-color: var(--kitchen-preparing-border);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1) 0%, var(--md-sys-color-surface-container, #2a2a4a) 100%);
        }

        .kitchen-order-card.ready {
            border-left-color: var(--kitchen-ready-border);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, var(--md-sys-color-surface-container, #2a2a4a) 100%);
        }

        .kitchen-order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .order-id {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--md-sys-color-primary, #4ade80);
        }

        .order-table {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 600;
        }

        .order-time {
            font-size: 0.875rem;
            color: var(--md-sys-color-on-surface-variant, #aaa);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .order-time.urgent {
            color: #F87171;
            font-weight: 600;
        }

        .kitchen-order-items {
            margin-bottom: 1rem;
        }

        .kitchen-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .kitchen-item:last-child {
            border-bottom: none;
        }

        .item-icon {
            font-size: 1.5rem;
        }

        .item-name {
            flex: 1;
            font-weight: 500;
        }

        .item-qty {
            background: var(--md-sys-color-primary, #006400);
            color: var(--md-sys-color-on-primary, #fff);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.875rem;
        }

        .item-notes {
            font-size: 0.75rem;
            color: #F59E0B;
            font-style: italic;
            margin-left: 2.25rem;
        }

        .kitchen-order-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .kitchen-order-actions button {
            flex: 1;
            padding: 0.875rem 1rem;
            border: none;
            border-radius: 12px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-warning {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: #fff;
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, #FBBF24, #F59E0B);
            transform: translateY(-1px);
        }

        .btn-success {
            background: linear-gradient(135deg, #10B981, #059669);
            color: #fff;
        }

        .btn-success:hover {
            background: linear-gradient(135deg, #34D399, #10B981);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: var(--md-sys-color-on-surface, #fff);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .kitchen-empty {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--md-sys-color-on-surface-variant, #aaa);
        }

        .kitchen-empty .empty-icon {
            font-size: 5rem;
            display: block;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .kitchen-empty p {
            font-size: 1.25rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .kitchen-header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }

            .kitchen-stats {
                width: 100%;
                justify-content: space-between;
            }

            .stat-item {
                padding: 0.5rem 0.75rem;
            }

            .stat-value {
                font-size: 1.25rem;
            }

            .kitchen-orders-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Sound notification pulse */
        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
        }

        /* Navigation */
        .kitchen-nav {
            display: flex;
            gap: 0.5rem;
        }

        .nav-btn {
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .notification-badge {
            background: #10B981;
            padding: 0.125rem 0.5rem;
            border-radius: 10px;
            font-weight: 700;
        }
    </style>
</head>

<body>

                    <span class="badge" id="allCount">0</span>
                </button>
                <button type="button" class="kitchen-tab" data-status="pending"
                    onclick="KitchenPage.filterOrders('pending')">

                    <span class="badge" id="pendingTabCount">0</span>

    <script src="js/analytics-tracker.js"></script>
    <script src="js/debug.js"></script>

    <script src="js/utils.js"></script>

    <script src="js/kitchen.js"></script>

    <script>
        // Kitchen Page Controller
        const KitchenPage = {
            currentFilter: 'all',

            init() {
                // Check authentication
                if (typeof KitchenAuth !== 'undefined' && KitchenAuth.isAuthenticated()) {
                    this.onLoginSuccess();
                } else {
                    document.getElementById('section-login').classList.remove('hidden');
                    document.getElementById('kitchen-main').classList.add('hidden');
                }
            },

            async login(event) {
                event.preventDefault();
                const name = document.getElementById('kitchenName').value.trim();
                const pin = document.getElementById('kitchenPin').value.trim();

                if (!name || !pin) {
                    alert('Vui lòng nhập đầy đủ thông tin');
                    return;
                }

                const btn = document.querySelector('.btn-login');
                btn.disabled = true;
                btn.textContent = 'Đang đăng nhập...';

                if (typeof KitchenAuth !== 'undefined') {
                    const result = await KitchenAuth.login(name, pin);
                    if (result.success) {
                        this.onLoginSuccess();
                    } else {
                        alert(result.error || 'Đăng nhập thất bại');
                    }
                } else {
                    // Demo mode
                    if (name.toLowerCase() === 'bếp chính' && pin === '1234') {
                        localStorage.setItem('kitchen_demo_session', 'true');
                        this.onLoginSuccess();
                    } else {
                        alert('Tên hoặc PIN không đúng');
                    }
                }

                btn.disabled = false;
                btn.textContent = '🔓 Đăng Nhập';
                document.getElementById('kitchenPin').value = '';
            },

            onLoginSuccess() {
                document.getElementById('section-login').classList.add('hidden');
                document.getElementById('kitchen-main').classList.remove('hidden');

                // Update date/time
                this.updateDateTime();
                setInterval(() => this.updateDateTime(), 1000);

                // Initialize Kitchen Display
                if (typeof KitchenDisplay !== 'undefined') {
                    KitchenDisplay.init();
                }

                // Update counters periodically
                setInterval(() => this.updateCounters(), 5000);
            },

            logout() {
                if (typeof KitchenAuth !== 'undefined') {
                    KitchenAuth.logout();
                }
                localStorage.removeItem('kitchen_demo_session');
                location.reload();
            },

            updateDateTime() {
                const now = new Date();
                const options = {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                };
                document.getElementById('currentDateTime').textContent = now.toLocaleDateString('vi-VN', options);
            },

            filterOrders(status) {
                this.currentFilter = status;

                // Update active tab
                document.querySelectorAll('.kitchen-tab').forEach(tab => {
                    tab.classList.toggle('active', tab.dataset.status === status);
                });

                // Filter displayed orders
                const cards = document.querySelectorAll('.kitchen-order-card');
                cards.forEach(card => {
                    if (status === 'all') {
                        card.style.display = '';
                    } else {
                        card.style.display = card.classList.contains(status) ? '' : 'none';
                    }
                });
            },

            updateCounters() {
                if (typeof KitchenDisplay === 'undefined') return;

                const orders = KitchenDisplay.orders || [];
                const allOrders = JSON.parse(localStorage.getItem('fb_orders') || '[]');

                const pending = orders.filter(o => o.status === 'pending').length;
                const preparing = orders.filter(o => o.status === 'preparing').length;
                const ready = allOrders.filter(o => o.status === 'ready').length;
                const total = pending + preparing;

                // Update header stats
                document.getElementById('pendingCount').textContent = pending;
                document.getElementById('preparingCount').textContent = preparing;
                document.getElementById('readyCount').textContent = ready;

                // Update tab badges
                document.getElementById('allCount').textContent = total;
                document.getElementById('pendingTabCount').textContent = pending;
                document.getElementById('preparingTabCount').textContent = preparing;
                document.getElementById('readyTabCount').textContent = ready;

                // Update notification badge
                document.getElementById('notificationBadge').textContent = ready;
            }
        };

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            KitchenPage.init();

            // Initial counter update after a short delay
            setTimeout(() => KitchenPage.updateCounters(), 1000);
        });
    </script>
</body>

</html>
